name: 个人数字记忆系统提醒

on:
  schedule:
    - cron: '0 2 * * 0,1-5'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 发送飞书提醒
        run: |
          curl -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "interactive",
              "card": {
                "header": {
                  "title": { "tag": "plain_text", "content": "📋 个人数字记忆系统" },
                  "template": "blue"
                },
                "elements": [
                  {
                    "tag": "div",
                    "text": {
                      "tag": "lark_md",
                      "content": "Hi 👋\n\n今天的**记忆记录**还没填哦，请记得填写！\n\n📅 填写内容：今日完成、明日计划、遇到问题、感悟思考"
                    }
                  },
                  {
                    "tag": "action",
                    "actions": [{
                      "tag": "button",
                      "text": { "tag": "plain_text", "content": "👉 点击填写个人数字记忆系统" },
                      "type": "primary",
                      "url": "https://memorysystem.congwei970225.workers.dev/"
                    }]
                  }
                ]
              }
            }'
